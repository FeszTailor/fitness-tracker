<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Grundfitness</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grundfitness">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0F1F" media="(prefers-color-scheme: dark)">
<style>
  :root{
    --bg:#EEF1F6;
    --surface:#FFFFFF;
    --surface-2:#F3F5FA;
    --ink:#0E1730;
    --muted:#5E6A85;
    --line:#DFE4EE;
    --ok:#178A5C;
    --accent:#2446F5;
    --accent-soft:#E4E9FF;
    --on-accent:#FFFFFF;
    --shadow:0 1px 2px rgba(14,23,48,.05), 0 8px 24px rgba(14,23,48,.06);
    --font:ui-rounded, "SF Pro Rounded", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  body[data-program="frau"]{
    --bg:#F8F0F3;
    --surface:#FFFFFF;
    --surface-2:#F9EEF2;
    --ink:#2B1A24;
    --muted:#7B6672;
    --line:#EDDDE4;
    --accent:#B5386B;
    --accent-soft:#FBE3EC;
    --shadow:0 1px 2px rgba(74,20,45,.05), 0 8px 24px rgba(74,20,45,.07);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0A0F1F;
      --surface:#141B31;
      --surface-2:#1C2542;
      --ink:#EEF2FF;
      --muted:#97A3C3;
      --line:#27314F;
      --ok:#4ADE9A;
      --accent:#7C96FF;
      --accent-soft:#1E2A57;
      --on-accent:#0A0F1F;
      --shadow:none;
    }
    body[data-program="frau"]{
      --bg:#170E14;
      --surface:#23161E;
      --surface-2:#2F1E28;
      --ink:#FBEFF4;
      --muted:#B9A1AD;
      --line:#3C2833;
      --accent:#F08BB0;
      --accent-soft:#4A2236;
      --on-accent:#2B0F1C;
      --shadow:none;
    }
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    font-size:16px;
    line-height:1.35;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  button, input{font-family:inherit; color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:3px solid var(--accent); outline-offset:2px;}

  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 120px);
  }

  /* Kopf */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:12px;
  }
  .topbar h1{
    font-size:17px;
    font-weight:700;
    margin:0;
  }
  .count{
    font-size:14px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  /* Umschalter */
  .segmented{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px;
    padding:4px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:22px;
  }
  .tab-btn{
    border:none;
    background:transparent;
    color:var(--muted);
    font-size:16px;
    font-weight:600;
    padding:10px 8px;
    border-radius:10px;
    min-height:44px;
  }
  .tab-btn.active{
    background:var(--accent);
    color:var(--on-accent);
  }

  /* Tag + Datum + Woche */
  .hero-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin:10px 0 18px;
  }
  .hero-title{
    font-size:44px;
    font-weight:800;
    line-height:1;
    letter-spacing:-0.5px;
    margin:0;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .date-field{flex:0 1 auto; min-width:0;}
  .date-field input{
    width:158px; max-width:100%;
    font-size:16px;
    font-weight:600;
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:12px;
    padding:9px 10px;
    min-height:44px;
    color:var(--ink);
    color-scheme:light dark;
  }
  .week{
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
    font-size:14px;
    color:var(--muted);
  }
  .week-dots{display:flex; gap:6px;}
  .week-dot{
    width:22px; height:8px;
    border-radius:4px;
    background:var(--line);
  }
  .week-dot.done{background:var(--accent);}

  .note{
    background:var(--accent-soft);
    color:var(--ink);
    border-radius:14px;
    padding:12px 14px;
    font-size:15px;
    font-weight:600;
    margin-bottom:14px;
  }

  /* Satz-Karten */
  .set{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .set > summary{
    list-style:none;
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:10px;
    padding:14px 16px;
    min-height:52px;
    cursor:pointer;
  }
  .set > summary::-webkit-details-marker{display:none;}
  .set-name{font-size:17px; font-weight:700;}
  .set-sum{
    font-size:14px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    text-align:right;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .set[open] .set-sum{visibility:hidden;}
  .set-state{
    display:flex; align-items:center; gap:6px;
    font-size:14px; font-weight:600;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .set-state.full{color:var(--ok);}
  .set-state svg{width:16px; height:16px;}
  .chev{width:18px; height:18px; color:var(--muted); transition:transform .15s ease;}
  .set[open] .chev{transform:rotate(180deg);}
  .bar{
    height:6px;
    background:var(--surface-2);
    margin:0 16px;
    border-radius:3px;
    overflow:hidden;
  }
  .bar > i{
    display:block; height:100%;
    background:var(--accent);
    border-radius:3px;
    transition:width .25s ease;
  }
  .set-body{padding:6px 16px 10px;}
  .ex{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:7px 0;
  }
  .ex + .ex{border-top:1px solid var(--line);}
  .ex-name{font-size:16px; font-weight:500;}
  .ex-field{display:flex; align-items:baseline; gap:6px;}
  .ex-field input{
    width:68px;
    font-size:22px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    text-align:center;
    padding:6px 4px;
    border:1px solid transparent;
    border-radius:12px;
    background:var(--surface-2);
    -moz-appearance:textfield;
    appearance:textfield;
  }
  .ex-field input::-webkit-outer-spin-button,
  .ex-field input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .ex-field input:focus{border-color:var(--accent); outline:none; background:var(--surface);}
  .ex-unit{font-size:13px; color:var(--muted); width:30px;}
  .set-remove{
    display:block;
    margin:8px 0 2px auto;
    background:none; border:none;
    font-size:14px; font-weight:600;
    color:var(--muted);
    text-decoration:underline;
    padding:8px 0;
  }
  .rest{
    text-align:center;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    padding:9px 0;
  }

  /* Plan anpassen */
  .adjust{
    margin-top:16px;
    border:1px solid var(--line);
    border-radius:18px;
    background:var(--surface);
  }
  .adjust > summary{
    list-style:none;
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px;
    min-height:52px;
    font-size:16px; font-weight:600;
    cursor:pointer;
  }
  .adjust > summary::-webkit-details-marker{display:none;}
  .adjust[open] .chev{transform:rotate(180deg);}
  .adjust-body{padding:0 16px 14px;}
  .adjust-row{
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px 12px;
    padding:12px 0;
    border-top:1px solid var(--line);
  }
  .adjust-text{flex:1 1 170px;}
  .adjust-text b{display:block; font-size:15px; font-weight:600;}
  .adjust-text span{display:block; font-size:13px; color:var(--muted);}
  .adjust-btns{display:flex; gap:8px; flex-wrap:wrap;}
  .pill{
    border:1px solid var(--line);
    background:var(--surface-2);
    border-radius:12px;
    min-height:44px; min-width:52px;
    padding:8px 14px;
    font-size:16px; font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .pill:active{background:var(--accent-soft);}

  /* Abschließen */
  .cta-bar{
    position:fixed; left:0; right:0; bottom:0;
    padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);
    background:linear-gradient(to top, var(--bg) 70%, transparent);
    z-index:5;
  }
  .complete-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; max-width:448px; margin:0 auto;
    min-height:56px;
    border:none; border-radius:18px;
    background:var(--accent); color:var(--on-accent);
    font-size:18px; font-weight:700;
  }
  .complete-btn:active{transform:scale(.985);}
  .complete-btn.done{background:var(--ok); color:var(--on-accent);}
  .complete-btn svg{width:20px; height:20px;}

  /* Frage: neuer Satz */
  .prompt-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:22px 18px 18px;
  }
  .prompt-card h2{font-size:22px; font-weight:800; margin:0 0 6px;}
  .prompt-card p{font-size:16px; color:var(--muted); margin:0 0 18px;}
  .prompt-btns{display:grid; gap:8px;}
  .prompt-btns button{
    min-height:52px; border-radius:14px;
    font-size:17px; font-weight:700;
    border:1px solid var(--line);
    background:var(--surface-2);
  }
  .prompt-btns .yes{background:var(--accent); color:var(--on-accent); border-color:transparent;}

  /* Verlauf */
  .section-title{
    font-size:20px; font-weight:800;
    margin:34px 0 10px;
  }
  .history-list{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:2px 16px;
  }
  .history-item{
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:12px;
    padding:12px 0;
  }
  .history-item + .history-item{border-top:1px solid var(--line);}
  .h-day{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums;}
  .h-date{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .h-detail{
    font-size:14px; color:var(--muted);
    font-variant-numeric:tabular-nums;
    text-align:right;
    overflow-wrap:anywhere;
  }
  .h-detail div + div{margin-top:2px;}
  .h-del{
    border:none; background:none;
    color:var(--muted);
    width:44px; height:44px; margin-right:-12px;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700;
  }
  .h-del svg{width:18px; height:18px;}
  .h-del.confirm{
    width:auto; padding:0 12px; margin-right:0;
    background:#C8321F; color:#FFFFFF;
  }
  .empty-hist{font-size:15px; color:var(--muted); padding:16px 0;}

  .backup-row{display:flex; flex-wrap:wrap; gap:8px;}
  .backup-row button, .backup-row label{
    display:inline-flex; align-items:center; justify-content:center;
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:12px;
    min-height:44px;
    padding:8px 14px;
    font-size:15px; font-weight:600;
    cursor:pointer;
  }
  .backup-hint{font-size:13px; color:var(--muted); margin:10px 0 0;}
  .loading{text-align:center; padding:40px 0; color:var(--muted);}

  /* Beine: weichere Formen, Titel in Serifenschrift */
  body[data-program="frau"] .hero-title{
    font-family:ui-serif, "New York", "Iowan Old Style", Georgia, serif;
    font-weight:700;
    letter-spacing:0;
  }
  body[data-program="frau"] .set,
  body[data-program="frau"] .adjust,
  body[data-program="frau"] .history-list,
  body[data-program="frau"] .prompt-card{border-radius:26px;}
  body[data-program="frau"] .segmented{border-radius:999px;}
  body[data-program="frau"] .tab-btn,
  body[data-program="frau"] .complete-btn,
  body[data-program="frau"] .pill,
  body[data-program="frau"] .date-field input,
  body[data-program="frau"] .backup-row button,
  body[data-program="frau"] .backup-row label{border-radius:999px;}
  body[data-program="frau"] .ex-field input{border-radius:999px;}
  body[data-program="frau"] .bar,
  body[data-program="frau"] .bar > i{height:8px; border-radius:4px;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body data-program="leonard">
<div class="wrap">
  <div class="topbar">
    <h1>Grundfitness</h1>
    <div class="count" id="streakLabel"></div>
  </div>

  <div class="segmented" role="tablist">
    <button class="tab-btn" id="tabLeonard" role="tab">Oberkörper</button>
    <button class="tab-btn" id="tabFrau" role="tab">Beine</button>
  </div>

  <div id="content" class="loading">Lade Fortschritt…</div>

  <h2 class="section-title">Verlauf</h2>
  <div id="historyList"></div>

  <h2 class="section-title">Datensicherung</h2>
  <div class="backup-row">
    <button id="exportBtn">Backup speichern</button>
    <button id="copyBtn">Kopieren</button>
    <label for="importFile" id="importLabel">Backup laden</label>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>
  <p class="backup-hint">Deine Daten liegen nur auf diesem Gerät. Ein Backup nach dem Training schützt vor Verlust.</p>
</div>

<script>
const STORAGE_KEY = 'fitness-progress';

/* ==================== Programm "Ich" (Leonard) ==================== */

/* ---------- Tier-Werte ---------- */
// Tier 0: Ziel 20 Wdh. / 40s (Basis). Tier 1: 25 Wdh. / 60s (konkret vorgegeben).
// Weitere Tiers sind extrapoliert (+5 Wdh. / +20s je Tier) und noch nicht bestätigt.
function tierMaxReps(tier){ return 20 + tier * 5; }
function tierMaxPlank(tier){ return 40 + tier * 20; }

// Plank-Wert direkt aus dem Wdh.-Wert ableiten (robust, unabhängig vom aktuellen Tier-Zähler):
function repsToPlank(reps){
  if (reps <= 20) return reps * 2;
  return 40 + (reps - 20) * 4;
}

/* ---------- Legacy-Funktionen (nur für Migration ganz alter Speicherstände) ---------- */
function legacyPlanForDay(day){
  if (day <= 9){ return { reps: [day + 9] }; }
  if (day === 10){ return { reps: [20] }; }
  let fixedSets = 1, growing = 10, d = 11;
  while (d < day){
    growing += 1;
    if (growing > 20){ fixedSets += 1; growing = 10; }
    d += 1;
  }
  return { reps: Array(fixedSets).fill(20).concat([growing]) };
}
function legacyPullUpsForDay(day, startDay){
  const steps = Math.floor((day - startDay) / 2);
  return Math.max(1, Math.min(5, 1 + steps));
}

/* ---------- Programm-Fortschritt (Sätze, Tier-Sprünge, Klimmzüge) ---------- */
function freshProgram(){
  return {
    tier: 0,
    sets: [ { reps: 10, pu: 1, puLastInc: 1 } ],
    pendingSetPrompt: false,
    tierUpgradeQueue: []
  };
}

// Klimmzug-Deckel pro Satz: runde Zahlen statt "Sätze + 4".
// Satz bis 20 Wdh.: max. 5 Klimmzüge. Satz auf der höheren Stufe (25 Wdh.): max. 10.
function pullUpCap(set){
  return set.reps > 20 ? 10 : 5;
}

// Wird nach jedem abgeschlossenen Tag aufgerufen und berechnet den Plan für den NÄCHSTEN Tag.
function advanceProgram(program, nextDay){
  let justJumpedIdx = null;

  if (program.tierUpgradeQueue.length > 0){
    const idx = program.tierUpgradeQueue.shift();
    const newTier = program.tier + 1;
    program.sets[idx].reps = tierMaxReps(newTier);
    justJumpedIdx = idx;
    if (program.tierUpgradeQueue.length === 0){
      program.tier = newTier;
    }
  } else {
    let justCompletedIdx = null;
    program.sets.forEach((set, i) => {
      if (set.reps < 20){
        set.reps += 1;
        if (set.reps === 20 && justCompletedIdx === null) justCompletedIdx = i;
      }
    });

    const total = program.sets.length;
    const allFull = program.sets.every(s => s.reps >= 20);
    if (allFull && total < 4){
      // Satz 2–4 automatisch starten (greift auch nach "Satz zurück", wenn kein Satz mehr wächst)
      program.sets.push({ reps: 10, pu: 1, puLastInc: nextDay });
    } else if (justCompletedIdx !== null && allFull){
      program.pendingSetPrompt = true;
    }

    if (program.tier === 0 &&
        program.sets.length >= 4 &&
        program.sets.slice(0, 4).every(s => s.reps === 20)){
      program.tierUpgradeQueue = [0, 1, 2, 3];
    }
  }

  program.sets.forEach((set, i) => {
    if (i === justJumpedIdx){
      set.pu = 5;
      set.puLastInc = nextDay;
    } else if (nextDay - set.puLastInc >= 2 && set.pu < pullUpCap(set)){
      set.pu += 1;
      set.puLastInc = nextDay;
    }
  });
}

/* ==================== Programm "Beine" (Frau) ==================== */
// Läuft nach Sätzen wie "Oberkörper": Crunches ist der Taktgeber (10→20, +1/Session).
// JEDER neue Satz (auch Satz 2, 3, ...) startet identisch: 10/20/20/20s/5 (Crunches/Squat/Glute/Plank/Push-Ups).
// Squat, Glute und Plank wachsen +2/Session ohne eigenen Deckel; Push-Ups +1 alle 2 Sessions,
// gezählt relativ zum Start des jeweiligen Satzes (nicht global).
// Sobald Crunches 20 erreicht, ist der Satz voll -> neuer Satz beginnt. Dabei wird geprüft, ob
// Squat bzw. Glute die 40 erreicht haben: falls ja, wechselt EINMALIG (insgesamt, nicht pro Satz)
// der Übungsname auf die schwerere Variante (Bulgarian Split Squats / einbeinige Glute Bridges).
function freshFrauSet(startSession){
  return {
    crunches: 10,
    squat: 20,
    glute: 20,
    plank: 20,
    pushup: 5,
    pushupLastInc: startSession
  };
}

function freshFrauState(){
  return {
    session: 1,
    history: [],
    sets: [ freshFrauSet(1) ],
    squatVariant: 'Squats',
    squatTierDone: false,
    gluteVariant: 'Glute Bridges',
    gluteTierDone: false,
    transitionNote: null
  };
}

function advanceFrau(frau, nextSession){
  const set = frau.sets[frau.sets.length - 1];

  if (set.crunches === 20){
    // Satz war bereits (aus dem letzten Aufruf) voll -> jetzt erst neuen Satz eröffnen,
    // ohne in diesem Schritt noch zusätzlich zu wachsen.
    let changedName = null;
    if (!frau.squatTierDone && set.squat >= 40){
      frau.squatVariant = 'Bulgarian Split Squats';
      frau.squatTierDone = true;
      changedName = frau.squatVariant;
    }
    if (!frau.gluteTierDone && set.glute >= 40){
      frau.gluteVariant = 'einbeinige Glute Bridges';
      frau.gluteTierDone = true;
      changedName = changedName ? `${changedName} & ${frau.gluteVariant}` : frau.gluteVariant;
    }
    frau.sets.push(freshFrauSet(nextSession));
    frau.transitionNote = changedName ? `Neue Übung ab jetzt: ${changedName}.` : null;
    frau.session = nextSession;
    return;
  }

  set.crunches += 1;
  set.squat += 2;
  set.glute += 2;
  set.plank += 2;
  set.pushup = frauPushupsFor(set.crunches);

  frau.session = nextSession;
}

/* ==================== gemeinsame Helfer ==================== */

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'2-digit' });
}

function toDateInputValue(d){
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

/* ==================== Bausteine der Oberfläche ==================== */

const ICON_CHECK = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg>';
const ICON_CHEV = '<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>';
const ICON_X = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>';

function exerciseRow(label, id, value, unit){
  const unitLabel = unit === 's' ? 'Sek.' : 'Wdh.';
  return `
    <label class="ex" for="${id}">
      <span class="ex-name">${label}</span>
      <span class="ex-field">
        <input type="number" inputmode="numeric" min="0" id="${id}" value="${value}">
        <span class="ex-unit">${unitLabel}</span>
      </span>
    </label>`;
}

// Eine Satz-Karte. Volle Sätze sind eingeklappt und zeigen ihre Werte in einer Zeile.
function setCard(o){
  return `
    <details class="set" ${o.open ? 'open' : ''}>
      <summary>
        <span class="set-name">Satz ${o.num}</span>
        <span class="set-sum">${o.summary}</span>
        <span class="set-state${o.full ? ' full' : ''}">${o.full ? ICON_CHECK : ''}${o.stateText}${ICON_CHEV}</span>
      </summary>
      <div class="bar"><i style="width:${o.pct}%"></i></div>
      <div class="set-body">${o.rows}${o.extra || ''}</div>
    </details>`;
}

// Beim Auf- und Zuklappen die Kurzzeile aus den Feldern neu bilden (falls Zahlen geändert wurden).
function bindSetCards(){
  document.querySelectorAll('details.set').forEach(card => {
    card.addEventListener('toggle', () => {
      const vals = Array.from(card.querySelectorAll('.ex')).map(row => {
        const isSeconds = row.querySelector('.ex-unit').textContent === 'Sek.';
        return row.querySelector('input').value + (isSeconds ? 's' : '');
      });
      card.querySelector('.set-sum').textContent = vals.join('/');
    });
  });
}

// Trainings in dieser Woche (Woche beginnt am Sonntag, Ziel: 3).
function weekHtml(){
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
  const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 7);
  const n = activeBucket().history.filter(r => {
    const d = new Date(r.date);
    return d >= start && d < end;
  }).length;
  let dots = '';
  for (let i = 0; i < 3; i++){ dots += `<span class="week-dot${i < n ? ' done' : ''}"></span>`; }
  return `<span class="week"><span class="week-dots">${dots}</span><span>Woche: ${n} von 3</span></span>`;
}

function heroHtml(title){
  return `
    <h2 class="hero-title">${title}</h2>
    <div class="hero-meta">
      ${weekHtml()}
      <span class="date-field"><input type="date" id="entryDate" value="${toDateInputValue(new Date())}" aria-label="Datum des Trainings"></span>
    </div>`;
}

let adjustOpen = false;
try{ adjustOpen = localStorage.getItem('fitness-adjust-open') === '1'; }catch(e){}

function ctaHtml(label){
  return `<div class="cta-bar"><button class="complete-btn" id="completeBtn">${label}</button></div>`;
}

let state = { active: 'leonard', leonard: { currentDay: 1, history: [], pullUpStartDay: 1, program: freshProgram() }, frau: freshFrauState() };

function migrateLeonardBucket(b){
  let changed = false;
  if (b.pullUpStartDay === undefined){ b.pullUpStartDay = b.currentDay; changed = true; }
  if (Array.isArray(b.history)){
    b.history.forEach((rec, i) => {
      if (!rec.id){ rec.id = 'legacy-' + i + '-' + Date.now(); changed = true; }
    });
  }
  if (!b.program){
    const oldPlan = legacyPlanForDay(b.currentDay);
    const oldPullUps = legacyPullUpsForDay(b.currentDay, b.pullUpStartDay);
    b.program = {
      tier: 0,
      sets: oldPlan.reps.map(r => ({ reps: r, pu: oldPullUps, puLastInc: b.currentDay })),
      pendingSetPrompt: false,
      tierUpgradeQueue: []
    };
    changed = true;
  } else if (b.program.sets.length && typeof b.program.sets[0] !== 'object'){
    const oldPu = b.program.pullUpValue || 1;
    b.program.sets = b.program.sets.map(r => ({ reps: r, pu: oldPu, puLastInc: b.currentDay }));
    delete b.program.pullUpValue;
    delete b.program.pullUpCap;
    delete b.program.pullUpLastIncDay;
    changed = true;
  }
  if (b.program && Array.isArray(b.program.sets) && typeof b.program.sets[0] === 'object'){
    b.program.sets.forEach(s => { const cap = pullUpCap(s); if (s.pu > cap){ s.pu = cap; changed = true; } });
  }
  return changed;
}

// Bringt state (egal aus welcher alten Version geladen/importiert) in das aktuelle Zwei-Programm-Format.
function migrateFrauBucket(f){
  if (Array.isArray(f.sets)){
    if (f.sets.length && f.sets[f.sets.length - 1].plank === undefined){
      // Zwischenstand: Sätze existierten schon, aber Plank/Push-Ups waren noch satzunabhängig
      const oldPlank = typeof f.plank === 'number' ? f.plank : 20;
      const oldPushup = f.pushup && typeof f.pushup.reps === 'number' ? f.pushup.reps : 5;
      f.sets.forEach((set, i) => {
        set.plank = oldPlank;
        set.pushup = oldPushup;
        set.pushupLastInc = f.session;
      });
      delete f.plank;
      delete f.pushup;
      return true;
    }
    return false; // schon vollständig im aktuellen Format
  }
  // ganz altes Flach-Format (vor jeder Satz-Umstellung): einzelnen Stand als Satz 1 übernehmen
  const oldCrunches = typeof f.crunches === 'number' ? f.crunches : 10;
  const oldSquat = f.squat && typeof f.squat.reps === 'number' ? f.squat.reps : 20;
  const oldGlute = f.glute && typeof f.glute.reps === 'number' ? f.glute.reps : 20;
  const oldPlank = typeof f.plank === 'number' ? f.plank : 20;
  const oldPushup = f.pushup && typeof f.pushup.reps === 'number' ? f.pushup.reps : 5;
  f.sets = [ { crunches: Math.min(20, oldCrunches), squat: oldSquat, glute: oldGlute, plank: oldPlank, pushup: oldPushup, pushupLastInc: f.session || 1 } ];
  f.squatVariant = (f.squat && f.squat.variant) || 'Squats';
  f.squatTierDone = !!(f.squat && f.squat.tierDone);
  f.gluteVariant = (f.glute && f.glute.variant) || 'Glute Bridges';
  f.gluteTierDone = !!(f.glute && f.glute.tierDone);
  f.transitionNote = null;
  delete f.crunches;
  delete f.squat;
  delete f.glute;
  delete f.plank;
  delete f.pushup;
  return true;
}

function normalizeState(){
  let needsSave = false;
  if (!state.active){
    // ganz altes Flat-Format (nur "Ich"-Programm ohne Umschalter) -> in leonard-Bucket verpacken
    const bucket = {
      currentDay: state.currentDay || 1,
      history: state.history || [],
      pullUpStartDay: state.pullUpStartDay,
      program: state.program
    };
    state = { active: 'leonard', leonard: bucket, frau: freshFrauState() };
    needsSave = true;
  }
  if (!state.frau){ state.frau = freshFrauState(); needsSave = true; }
  if (!state.leonard){ state.leonard = { currentDay: 1, history: [], pullUpStartDay: 1, program: freshProgram() }; needsSave = true; }
  if (migrateLeonardBucket(state.leonard)) needsSave = true;
  if (migrateFrauBucket(state.frau)) needsSave = true;
  return needsSave;
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){ state = JSON.parse(raw); }
  }catch(e){
    // kein vorheriger Fortschritt oder Zugriff nicht möglich
  }
  if (normalizeState()) await saveState();
}

async function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Speichern fehlgeschlagen', e);
  }
}

/* ==================== Rendering "Ich" ==================== */

function renderDay(){
  const program = state.leonard.program;
  const day = state.leonard.currentDay;

  if (program.pendingSetPrompt){
    const nextSetNum = program.sets.length + 1;
    document.getElementById('content').innerHTML = `
      <div class="prompt-card">
        <h2>Alle Sätze sind voll</h2>
        <p>Möchtest du Satz ${nextSetNum} dazunehmen? Er startet bei 10 Wdh.</p>
        <div class="prompt-btns">
          <button class="yes" id="promptYes">Ja, Satz ${nextSetNum} starten</button>
          <button class="no" id="promptNo">Nein, so weitermachen</button>
        </div>
      </div>
    `;
    document.getElementById('promptYes').addEventListener('click', () => respondToSetPrompt(true));
    document.getElementById('promptNo').addEventListener('click', () => respondToSetPrompt(false));
    return;
  }

  const numSets = program.sets.length;
  let setsHtml = '';
  program.sets.forEach((set, idx) => {
    const s = idx + 1;
    const plank = repsToPlank(set.reps);
    const isExtra = idx >= 4;
    const full = set.reps >= 20;
    let rows = '';
    rows += exerciseRow('Crunches', `crunches_${s}`, set.reps, 'x');
    rows += exerciseRow('Push-Ups', `pushups_${s}`, set.reps, 'x');
    rows += exerciseRow('Assisted Leg Raises', `legraises_${s}`, set.reps, 'x');
    rows += exerciseRow('Plank (low)', `plank_${s}`, plank, 's');
    rows += exerciseRow('Klimmzüge', `pullups_${s}`, set.pu, 'x');
    setsHtml += setCard({
      num: s,
      open: !full || s === numSets,
      full,
      stateText: full ? (set.reps > 20 ? `${set.reps} Wdh.` : 'voll') : `${set.reps} von 20`,
      pct: Math.min(100, Math.round(set.reps / 20 * 100)),
      summary: `${set.reps}/${set.reps}/${set.reps}/${plank}s/${set.pu}`,
      rows,
      extra: isExtra ? `<button class="set-remove" data-idx="${idx}">Satz entfernen</button>` : ''
    });
    if (s < numSets){
      setsHtml += `<div class="rest">1 min Pause</div>`;
    }
  });

  let noteHtml = '';
  if (program.tierUpgradeQueue.length > 0){
    const nextIdx = program.tierUpgradeQueue[0];
    noteHtml = `<div class="note">Nächste Stufe: Satz ${nextIdx + 1} steigt nach diesem Training auf ${tierMaxReps(program.tier + 1)} Wdh.</div>`;
  }

  document.getElementById('content').innerHTML = `
    ${heroHtml('Tag ' + day)}
    ${noteHtml}
    ${setsHtml}
    ${adjustPanelHtml(state.leonard.undo && state.leonard.undo.length)}
    ${ctaHtml('Tag abschließen')}
  `;

  document.getElementById('completeBtn').addEventListener('click', completeDay);
  document.getElementById('minusBtn').addEventListener('click', () => adjustLeonard(-1));
  document.getElementById('plusBtn').addEventListener('click', () => adjustLeonard(1));
  document.querySelectorAll('.set-remove').forEach(btn => {
    btn.addEventListener('click', () => removeSet(Number(btn.dataset.idx)));
  });
  bindConfirmButton('setBackBtn', stepBackLeonard);
  const fwdL = document.getElementById('setFwdBtn');
  if (fwdL) fwdL.addEventListener('click', undoStepBackLeonard);
  bindSetCards();
  bindAdjustPanel();
}

// "−1 / +1 Wdh." (Oberkörper): Wiederholungen des wachsenden (letzten) Satzes anpassen.
// Plank läuft automatisch mit (Wdh. x 2). Tageszähler und Verlauf bleiben unverändert.
async function adjustLeonard(delta){
  const program = state.leonard.program;
  const set = program.sets[program.sets.length - 1];
  const full = set.reps >= 20;
  if (delta > 0 && full){
    // letzter Satz ist voll -> neuen Satz bei 10 Wdh. aufmachen
    program.sets.push({ reps: 10, pu: 1, puLastInc: state.leonard.currentDay });
  } else if (set.reps > 20){
    return; // Sätze der höheren Stufe werden nicht verkleinert
  } else {
    set.reps = Math.max(1, Math.min(20, set.reps + delta));
  }
  await saveState();
  renderDay();
}

// Beine: Push-Ups hängen an den Crunches (alle 2 Wdh. ein Push-Up mehr, Start bei 5).
function frauPushupsFor(crunches){
  return Math.max(1, 5 + Math.floor((crunches - 10) / 2));
}

// "−1 / +1 Wdh." (Beine): letzten Satz eine Stufe hoch oder runter.
// Crunches ±1, Squats/Glute Bridges/Plank ±2, Push-Ups laufen mit.
async function adjustFrau(delta){
  const frau = state.frau;
  const set = frau.sets[frau.sets.length - 1];
  if (delta > 0 && set.crunches >= 20){
    // letzter Satz ist voll -> neuen Satz aufmachen (inkl. evtl. Wechsel auf die schwerere Übung)
    advanceFrau(frau, frau.session);
    await saveState();
    renderFrauDay();
    return;
  }
  const newCrunches = Math.max(1, Math.min(20, set.crunches + delta));
  const step = newCrunches - set.crunches;
  if (step === 0) return;
  set.crunches = newCrunches;
  set.squat = Math.max(2, set.squat + step * 2);
  set.glute = Math.max(2, set.glute + step * 2);
  set.plank = Math.max(2, set.plank + step * 2);
  set.pushup = frauPushupsFor(set.crunches);
  await saveState();
  renderFrauDay();
}

// Knopf mit Sicherheitsabfrage: 1. Tippen zeigt "Sicher?", 2. Tippen innerhalb von 3 Sekunden führt aus.
function bindConfirmButton(id, action){
  const btn = document.getElementById(id);
  const original = btn.textContent;
  let armed = false;
  btn.addEventListener('click', () => {
    if (armed){ action(); return; }
    armed = true;
    btn.textContent = 'Sicher?';
    setTimeout(() => {
      if (armed && document.body.contains(btn)){ armed = false; btn.textContent = original; }
    }, 3000);
  });
}

// "Satz zurück" (Oberkörper): letzten Satz entfernen, bei nur einem Satz diesen auf den Start zurücksetzen.
// Verlauf und Tageszähler bleiben unverändert.
async function stepBackLeonard(){
  // Stand vorher merken, damit "Satz fortführen" ihn wiederherstellen kann
  if (!Array.isArray(state.leonard.undo)) state.leonard.undo = [];
  state.leonard.undo.push({ program: JSON.parse(JSON.stringify(state.leonard.program)), day: state.leonard.currentDay });
  const program = state.leonard.program;
  program.pendingSetPrompt = false;
  program.tierUpgradeQueue = [];
  if (program.sets.length > 1){
    program.sets.pop();
  } else {
    program.sets = [ { reps: 10, pu: 1, puLastInc: state.leonard.currentDay } ];
  }
  if (program.sets.length < 4){
    // unterhalb von 4 Sätzen gibt es keine höhere Stufe -> zurück auf Stufe 0 (max. 20 Wdh.)
    program.tier = 0;
    program.sets.forEach(s => { if (s.reps > 20) s.reps = 20; });
  }
  program.sets.forEach(s => { const cap = pullUpCap(s); if (s.pu > cap) s.pu = cap; });
  await saveState();
  renderDay();
}


// "Satz fortführen" (Oberkörper): so weitermachen, als hätte es das letzte "Satz zurück" nie gegeben.
// Stand von damals holen und für jedes seitdem abgeschlossene Training normal weiterzählen
// (Satz 2 bei 14 zurückgedreht, 1 Training gemacht -> Satz 2 geht bei 15 weiter).
async function undoStepBackLeonard(){
  const undo = state.leonard.undo;
  if (!Array.isArray(undo) || undo.length === 0) return;
  const snap = undo.pop();
  const program = snap.program || snap; // ältere Einträge ohne Tag
  const fromDay = snap.day || state.leonard.currentDay;
  for (let d = fromDay + 1; d <= state.leonard.currentDay; d++){
    if (program.pendingSetPrompt) program.pendingSetPrompt = false;
    advanceProgram(program, d);
  }
  state.leonard.program = program;
  await saveState();
  renderDay();
}

async function respondToSetPrompt(addSet){
  const program = state.leonard.program;
  program.pendingSetPrompt = false;
  if (addSet){
    program.sets.push({ reps: 10, pu: 1, puLastInc: state.leonard.currentDay });
  }
  await saveState();
  renderDay();
}

async function removeSet(idx){
  const program = state.leonard.program;
  program.sets.splice(idx, 1);
  await saveState();
  renderDay();
}

async function completeDay(){
  const program = state.leonard.program;
  const day = state.leonard.currentDay;
  const dateInput = document.getElementById('entryDate').value;
  const chosenDate = dateInput ? new Date(dateInput + 'T12:00:00').toISOString() : new Date().toISOString();
  const record = {
    id: Date.now() + '-' + Math.floor(Math.random() * 1000),
    day,
    date: chosenDate,
    sets: program.sets.map((set, idx) => {
      const s = idx + 1;
      return {
        crunches: Number(document.getElementById(`crunches_${s}`).value),
        pushups: Number(document.getElementById(`pushups_${s}`).value),
        legraises: Number(document.getElementById(`legraises_${s}`).value),
        plank: Number(document.getElementById(`plank_${s}`).value),
        pullups: Number(document.getElementById(`pullups_${s}`).value),
      };
    })
  };
  state.leonard.history.unshift(record);
  state.leonard.currentDay++;
  advanceProgram(program, state.leonard.currentDay);
  await saveState();

  const btn = document.getElementById('completeBtn');
  btn.innerHTML = ICON_CHECK + 'Gespeichert';
  btn.classList.add('done');
  setTimeout(() => { render(); renderHistory(); }, 500);
}

/* ==================== Rendering "Frau" ==================== */

function renderFrauDay(){
  const frau = state.frau;
  const numSets = frau.sets.length;

  let setsHtml = '';
  frau.sets.forEach((set, idx) => {
    const s = idx + 1;
    const full = set.crunches >= 20;
    let rows = '';
    rows += exerciseRow('Crunches', `frau_crunches_${s}`, set.crunches, 'x');
    rows += exerciseRow(frau.squatVariant, `frau_squat_${s}`, set.squat, 'x');
    rows += exerciseRow(frau.gluteVariant, `frau_glute_${s}`, set.glute, 'x');
    rows += exerciseRow('Plank', `frau_plank_${s}`, set.plank, 's');
    rows += exerciseRow('Push-Ups', `frau_pushup_${s}`, set.pushup, 'x');
    setsHtml += setCard({
      num: s,
      open: !full || s === numSets,
      full,
      stateText: full ? 'voll' : `${set.crunches} von 20`,
      pct: Math.min(100, Math.round(set.crunches / 20 * 100)),
      summary: `${set.crunches}/${set.squat}/${set.glute}/${set.plank}s/${set.pushup}`,
      rows
    });
    if (s < numSets){
      setsHtml += `<div class="rest">1 min Pause</div>`;
    }
  });

  const noteHtml = frau.transitionNote ? `<div class="note">${frau.transitionNote}</div>` : '';

  document.getElementById('content').innerHTML = `
    ${heroHtml('Session ' + frau.session)}
    ${noteHtml}
    ${setsHtml}
    ${adjustPanelHtml(state.frau.undo && state.frau.undo.length)}
    ${ctaHtml('Session abschließen')}
  `;

  document.getElementById('completeBtn').addEventListener('click', completeFrauDay);
  document.getElementById('minusBtn').addEventListener('click', () => adjustFrau(-1));
  document.getElementById('plusBtn').addEventListener('click', () => adjustFrau(1));
  bindConfirmButton('setBackBtn', stepBackFrau);
  const fwdF = document.getElementById('setFwdBtn');
  if (fwdF) fwdF.addEventListener('click', undoStepBackFrau);
  bindSetCards();
  bindAdjustPanel();
}

// "Satz zurück" (Beine): letzten Satz entfernen, bei nur einem Satz diesen auf den Start zurücksetzen.
// Übungsnamen (z. B. Bulgarian Split Squats) bleiben, Verlauf und Session-Zähler auch.
async function stepBackFrau(){
  const frau = state.frau;
  // Stand vorher merken, damit "Satz fortführen" ihn wiederherstellen kann
  if (!Array.isArray(frau.undo)) frau.undo = [];
  frau.undo.push(JSON.parse(JSON.stringify({ sets: frau.sets, transitionNote: frau.transitionNote, session: frau.session })));
  frau.transitionNote = null;
  if (frau.sets.length > 1){
    frau.sets.pop();
  } else {
    frau.sets = [ freshFrauSet(frau.session) ];
  }
  await saveState();
  renderFrauDay();
}

// "Satz fortführen" (Beine): letztes "Satz zurück" aufheben und normal weiterzählen.
async function undoStepBackFrau(){
  const frau = state.frau;
  if (!Array.isArray(frau.undo) || frau.undo.length === 0) return;
  const snap = frau.undo.pop();
  const current = frau.session;
  frau.sets = snap.sets;
  frau.transitionNote = snap.transitionNote;
  // für jede seitdem abgeschlossene Session normal weiterzählen
  const fromSession = snap.session || current;
  for (let n = fromSession + 1; n <= current; n++){
    advanceFrau(frau, n);
  }
  frau.session = current;
  await saveState();
  renderFrauDay();
}

async function completeFrauDay(){
  const frau = state.frau;
  const dateInput = document.getElementById('entryDate').value;
  const chosenDate = dateInput ? new Date(dateInput + 'T12:00:00').toISOString() : new Date().toISOString();
  const record = {
    id: Date.now() + '-' + Math.floor(Math.random() * 1000),
    day: frau.session,
    date: chosenDate,
    sets: frau.sets.map((set, idx) => {
      const s = idx + 1;
      return {
        crunches: Number(document.getElementById(`frau_crunches_${s}`).value),
        squat: Number(document.getElementById(`frau_squat_${s}`).value),
        glute: Number(document.getElementById(`frau_glute_${s}`).value),
        plank: Number(document.getElementById(`frau_plank_${s}`).value),
        pushup: Number(document.getElementById(`frau_pushup_${s}`).value),
      };
    }),
    squatVariant: frau.squatVariant,
    gluteVariant: frau.gluteVariant
  };
  frau.history.unshift(record);
  frau.transitionNote = null; // wurde gerade angezeigt/bestätigt -> für die nächste Session ausblenden
  frau.session++;
  advanceFrau(frau, frau.session);
  await saveState();

  const btn = document.getElementById('completeBtn');
  btn.innerHTML = ICON_CHECK + 'Gespeichert';
  btn.classList.add('done');
  setTimeout(() => { render(); renderHistory(); }, 500);
}

/* ==================== gemeinsames Rendering / Umschalten ==================== */

function activeBucket(){
  return state.active === 'leonard' ? state.leonard : state.frau;
}

function render(){
  document.body.dataset.program = state.active;
  document.getElementById('content').classList.remove('loading');
  if (state.active === 'leonard'){ renderDay(); } else { renderFrauDay(); }
  const n = activeBucket().history.length;
  document.getElementById('streakLabel').textContent = n === 1 ? '1 Training' : n + ' Trainings';
}

function updateTabUI(){
  const tabs = { leonard: document.getElementById('tabLeonard'), frau: document.getElementById('tabFrau') };
  Object.keys(tabs).forEach(key => {
    tabs[key].classList.toggle('active', state.active === key);
    tabs[key].setAttribute('aria-selected', state.active === key ? 'true' : 'false');
  });
}

async function switchProgram(which){
  if (state.active === which) return;
  state.active = which;
  await saveState();
  updateTabUI();
  render();
  renderHistory();
}

/* ==================== Verlauf (beide Programme) ==================== */

let pendingDeleteId = null;

function renderHistory(){
  const list = document.getElementById('historyList');
  const bucket = activeBucket();
  const dayLabel = state.active === 'leonard' ? 'Tag' : 'Session';

  if (bucket.history.length === 0){
    list.innerHTML = `<div class="history-list"><div class="empty-hist">Noch kein Training eingetragen. Sobald du eins abschließt, steht es hier.</div></div>`;
    return;
  }

  const items = bucket.history.map((rec, idx) => {
    let lines;
    if (state.active === 'leonard'){
      lines = rec.sets.map(s => `${s.crunches}/${s.pushups}/${s.legraises}/${s.plank}s${s.pullups !== undefined ? '/' + s.pullups : ''}`);
    } else if (Array.isArray(rec.sets) && rec.sets.length && rec.sets[0].plank !== undefined){
      lines = rec.sets.map(s => `${s.crunches}/${s.squat}/${s.glute}/${s.plank}s/${s.pushup}`);
    } else if (Array.isArray(rec.sets)){
      // Verlaufseintrag aus dem Zwischenstand (Plank/Push-Ups noch satzunabhängig gespeichert)
      lines = rec.sets.map(s => `${s.crunches}/${s.squat}/${s.glute}`).concat([`${rec.plank}s/${rec.pushup}`]);
    } else {
      // Verlaufseintrag aus der alten (Nicht-Satz-)Version von "Beine"
      lines = [`${rec.crunches}/${rec.squat}/${rec.glute}/${rec.plank}s/${rec.pushup}`];
    }
    const isPending = pendingDeleteId === rec.id;
    return `
      <div class="history-item">
        <div>
          <div class="h-day">${dayLabel} ${rec.day}</div>
          <div class="h-date">${fmtDate(rec.date)}</div>
        </div>
        <div class="h-detail">${lines.map(l => `<div>${l}</div>`).join('')}</div>
        <button class="h-del${isPending ? ' confirm' : ''}" data-id="${rec.id}" data-idx="${idx}" aria-label="Eintrag löschen">${isPending ? 'Löschen?' : ICON_X}</button>
      </div>`;
  }).join('');
  list.innerHTML = `<div class="history-list">${items}</div>`;

  list.querySelectorAll('.h-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      if (pendingDeleteId === id){
        deleteHistoryEntry(id, Number(btn.dataset.idx));
      } else {
        pendingDeleteId = id;
        renderHistory();
        setTimeout(() => {
          if (pendingDeleteId === id){
            pendingDeleteId = null;
            renderHistory();
          }
        }, 3000);
      }
    });
  });
}

async function deleteHistoryEntry(id, idx){
  pendingDeleteId = null;
  const bucket = activeBucket();
  bucket.history = bucket.history.filter(r => r.id !== id);
  if (idx === 0){
    if (state.active === 'leonard'){
      bucket.currentDay = Math.max(1, bucket.currentDay - 1);
    } else {
      bucket.session = Math.max(1, bucket.session - 1);
    }
  }
  await saveState();
  render();
  renderHistory();
}

/* ==================== Backup ==================== */

async function exportBackup(){
  const now = new Date();
  const dateStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  const filename = `${dateStr}-fitness-backup.json`;
  const jsonStr = JSON.stringify(state, null, 2);

  try{
    const file = new File([jsonStr], filename, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: filename });
      return;
    }
  }catch(e){
    // abgebrochen oder nicht unterstützt -> Fallback unten
  }

  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function copyBackup(){
  const jsonStr = JSON.stringify(state, null, 2);
  const btn = document.getElementById('copyBtn');
  try{
    await navigator.clipboard.writeText(jsonStr);
    const original = btn.textContent;
    btn.textContent = 'Kopiert ✓';
    setTimeout(() => { btn.textContent = original; }, 1500);
  }catch(e){
    alert('Kopieren hat nicht geklappt. Nimm stattdessen "Backup speichern".');
  }
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      const looksValid = parsed.active || (typeof parsed.currentDay === 'number' && Array.isArray(parsed.history));
      if (!looksValid){
        alert('Diese Datei sieht nicht wie ein gültiges Backup aus.');
        return;
      }
      state = parsed;
      normalizeState();
      await saveState();
      updateTabUI();
      render();
      renderHistory();
    }catch(err){
      alert('Backup konnte nicht gelesen werden.');
    }
  };
  reader.readAsText(file);
}

/* ==================== Start ==================== */

async function init(){
  await loadState();
  updateTabUI();
  render();
  renderHistory();
  document.getElementById('tabLeonard').addEventListener('click', () => switchProgram('leonard'));
  document.getElementById('tabFrau').addEventListener('click', () => switchProgram('frau'));
  document.getElementById('exportBtn').addEventListener('click', exportBackup);
  document.getElementById('copyBtn').addEventListener('click', copyBackup);
  document.getElementById('importFile').addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]){
      importBackup(e.target.files[0]);
      e.target.value = '';
    }
  });
}
init();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
